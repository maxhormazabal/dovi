site_name: dovi
site_description: Document generation and replication for Document AI
repo_url: https://github.com/maxhormazabal/dovi
repo_name: maxhormazabal/dovi
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/iso.png
  favicon: assets/iso.png
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Document model: concepts/document_model.md
  - Reference:
      - CLI: reference/cli.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
